name: xue_hua_device_info
description: "Flutter plugin for device info: battery, network, storage, display, and system details."
version: 2.0.2
homepage: https://github.com/Matkurban/xue_hua_device_info
repository: https://github.com/Matkurban/xue_hua_device_info
issue_tracker: https://github.com/Matkurban/xue_hua_device_info/issues
documentation: https://github.com/Matkurban/xue_hua_device_info/blob/main/README.md

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.xuehua.xue_hua_device_info
        pluginClass: XueHuaDeviceInfoPlugin
      ios:
        pluginClass: XueHuaDeviceInfoPlugin
      linux:
        pluginClass: XueHuaDeviceInfoPlugin
      macos:
        pluginClass: XueHuaDeviceInfoPlugin
      windows:
        pluginClass: XueHuaDeviceInfoPluginCApi
