name: xue_hua_device_info
description: "Flutter plugin for device info: battery, network, storage, display, and system details."
version: 2.1.0
homepage: https://github.com/Matkurban
repository: https://github.com/Matkurban/xue_hua_device_info

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  jni: ^1.1.2
  meta: ^1.19.0
  objective_c: ^9.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^30.0.4
  ffigen: ^22.0.0
  swift2objc: ^0.3.1
  swiftgen: ^0.2.0
  path: ^1.9.1
  pub_semver: ^2.2.1
  jnigen: ^1.0.1
  logging: ^1.3.0

flutter:
  plugin:
    platforms:
      android:
        package: com.xuehua.xue_hua_device_info
        pluginClass: XueHuaDeviceInfoPlugin
      ios:
        pluginClass: XueHuaDeviceInfoPlugin
      linux:
        pluginClass: XueHuaDeviceInfoPlugin
      macos:
        pluginClass: XueHuaDeviceInfoPlugin
      windows:
        pluginClass: XueHuaDeviceInfoPluginCApi
